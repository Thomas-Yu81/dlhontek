name:
  zh: "HTPM-602型便携式溶解氧"
  en: "HTPM-602 Portable Dissolved Oxygen Meter"
summary:
  zh: "便携式溶氧仪由主机以及荧光法溶解氧传感器组成。采用先进的荧光法测定原理，没有膜和电解液，基本无需保养，测量时不会产生氧消耗，没有流速/搅动要求；且自带NTC温补功能，测量结果具有良好的重复性及稳定性。"
  en: "The portable DO meter consists of a handheld unit and an optical (fluorescence) DO sensor. With no membrane or electrolyte it needs almost no maintenance, consumes no oxygen and has no flow or stirring requirement. Built-in NTC temperature compensation gives good repeatability and stability."
features:
  zh:
    - "整机IP66防护等级"
    - "人体工学曲线设计，带有橡胶垫圈，适于手握操作，在潮湿环境中容易掌握"
    - "出厂标定，一年无需校准，可现场标定"
    - "数字化传感器，现场使用方便、快捷，和主机实现即插即用"
    - "带有USB接口，可以实现对内置电池充电，并可通过USB接口实现数据导出"
  en:
    - "IP66 overall protection"
    - "Ergonomic design with rubber grip, easy to hold in wet conditions"
    - "Factory calibrated, no calibration needed for one year; field calibration supported"
    - "Digital sensor, plug-and-play with the handheld unit"
    - "USB port for charging the built-in battery and exporting data"
