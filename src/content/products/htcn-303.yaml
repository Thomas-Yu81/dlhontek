model: "HTCN-303"
category: water-quality
featured: true
order: 50
name:
  zh: "HTCN-303系列余氯分析仪"
  en: "HTCN-303 Residual Chlorine Analyzer"
summary:
  zh: "HTCN-303余氯在线分析仪是一款全新的余氯分析仪，本表具有高度的高智能化和灵活性，可同时测量余氯、次氯酸，pH、温度，广泛应用于电力、供水、医药、化工、食品等行业，对水中的余氯和pH值进行连续测量。"
  en: "The HTCN-303 online residual chlorine analyzer is highly intelligent and flexible. It measures residual chlorine, hypochlorous acid, pH and temperature simultaneously and is widely used for continuous monitoring in power, water supply, pharmaceutical, chemical and food industries."
features:
  zh:
    - "采用面向对象的菜单设计，操作简单"
    - "全智能、多功能、测量性能高，环境适应性强等特点"
    - "多参数同时显示，余氯值、输出电流、时间"
    - "4-20mA变送输出、继电器高、低报警控制输出、RS485通信输出等各种变量输出，系统智能控制"
    - "适配多种类型测量电极"
    - "高精度自动温度补偿系统"
  en:
    - "Object-oriented menu, easy operation"
    - "Fully intelligent, multi-functional, high performance and robust"
    - "Displays chlorine value, output current and time simultaneously"
    - "4-20mA output, high/low alarm relays and RS485 communication for intelligent control"
    - "Compatible with various electrodes"
    - "High-precision automatic temperature compensation"
