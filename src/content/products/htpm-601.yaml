body:
  zh: |-
    <h2>注意事项</h2>
    <ul><li>校准时需要等待溶液示值稳定后，再确认。</li><li>电极校准确认前，需要放置在标液中，待显示温度稳定。</li><li>电极校准前，已长时间处于空气中，电极表面明显干燥，请用pH=4的溶液浸泡8个小时。</li><li>切换溶液是，需要先清洗干净，并用纸巾拭去溶液残留。</li><li>电极不能长时间浸泡在电导率低于300us/cm的溶液中，否则易造成参比电极故障。</li><li>使用完毕后应清洁后旋好带有保护液的护套并妥善保存。</li></ul>
  en: |-
    <h2>Notes</h2>
    <ul><li>When calibrating, wait for the reading to stabilize before confirming.</li><li>Before confirming calibration, keep the electrode in the standard solution until the temperature reading is stable.</li><li>If the electrode has been in air for a long time and its surface is dry, soak it in pH 4 solution for 8 hours before calibration.</li><li>When changing solutions, rinse the electrode and wipe off residue with a tissue.</li><li>Do not soak the electrode for long in solutions below 300 μS/cm, or the reference electrode may fail.</li><li>After use, clean the electrode, fit the cap with storage solution and store properly.</li></ul>
