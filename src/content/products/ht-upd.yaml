body:
  zh: |-
    <h2>安装使用</h2>
    <p>（1）浸没式安装方式</p>
    <p>浸没式传感器的最小浸没深度为30cm，或者浸没至取样时通常所达到的深度，并避免强光直射。</p>
    <p>（2）管道式安装方式</p>
    <p>管道式传感器有法兰连接安装和插入式安装两种方式，法兰连接安装方式用法兰将传感器管段嵌入管道中；插入式安装直接在原有管道上打孔，将传感器通过底座和球阀插入管道中。</p>
    <img src="/images/products/ht-upd/ht-upd-2.png" alt="HT-UPD系列超声波矿浆浓度计 安装使用">
  en: |-
    <h2>Installation &amp; Use</h2>
    <p>(1) Submersion installation</p>
    <p>The submersion sensor must be immersed at least 30 cm deep, or to the depth normally reached when sampling, and kept out of strong direct light.</p>
    <p>(2) Pipe installation</p>
    <p>Pipe sensors can be flange-mounted or inserted. Flange mounting fits the sensor spool into the pipeline; insertion mounting drills a hole in the existing pipe and inserts the sensor through a base and ball valve.</p>
    <img src="/images/products/ht-upd/ht-upd-2.png" alt="HT-UPD Installation &amp; Use">
