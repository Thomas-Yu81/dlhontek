name:
  zh: "HT-UPD系列超声波矿浆浓度计"
  en: "HT-UPD Ultrasonic Slurry Concentration Meter"
summary:
  zh: "HT-UPD系列超声波矿浆浓度计是为选矿、洗煤、冶金、造纸、污泥处理等过程处理中高浓度浆料监测而设计的在线监测仪表。可以实时在线监测0%至70%的浆料浓度变化并实现相关工艺过程自动控制。"
  en: "The HT-UPD ultrasonic slurry concentration meter is an online instrument designed for monitoring high-concentration slurries in mineral processing, coal washing, metallurgy, papermaking and sludge treatment. It monitors slurry concentration from 0% to 70% in real time and enables automatic process control."
features:
  zh:
    - "超声波测量方法，无射线污染，绝对安全"
    - "超声波发射能量自动调节，能够适应各种测量介质和宽广的量程"
    - "先进的电路设计和软件算法，能够消除现场干扰，稳定精确测量"
    - "管道插入式安装或者管道法兰式安装可满足不同现场要求"
    - "大屏幕液晶显示，可显示趋势线"
    - "测量单位%或g/l可现场选择"
    - "中文菜单，操作简便"
    - "4～20mA隔离电流输出"
    - "可选现场总线接口"
    - "设定限值报警和故障报警继电器输出"
  en:
    - "Ultrasonic measurement with no radiation, completely safe"
    - "Automatic adjustment of ultrasonic transmit power for various media and wide ranges"
    - "Advanced circuitry and algorithms reject field interference for stable, accurate measurement"
    - "Pipe insertion or flange mounting to suit different sites"
    - "Large LCD with trend display"
    - "Unit selectable on site: % or g/L"
    - "Chinese menu, easy operation"
    - "Isolated 4-20mA current output"
    - "Optional fieldbus interface"
    - "Relay outputs for limit and fault alarms"
