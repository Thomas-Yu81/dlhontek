body:
  zh: |-
    <h2>行业应用</h2>
    <p>行业推荐的雷达液位计采用了26GHz的发射频率，因而具有：</p>
    <ul><li>波束角小，能量集中，具有更强抗干扰能力，大大提高了测量准确度和可靠性</li><li>天线尺寸小，便于安装和加防尘罩等天线防护装置</li><li>重量轻约1KG，便于安装</li><li>测量范围可达70米，覆盖大型水库等水位测量</li><li>多种输出电路接口与采集系统配合</li><li>采用脉冲工作方式，雷达液位计发射功率极低，对人体及环境均无伤害</li></ul>
    <h2>安装使用</h2>
    <ul><li>安装前的准备</li></ul>
    <p>请注意以下事项，以确保仪表能正确安装：</p>
    <p>请预留足够的安装空间。</p>
    <p>请避免强烈震动的安装场合。</p>
    <ul><li>图示说明及安装位置</li></ul>
    <p>注：雷达天线发射微波脉冲时，都有一定发射角。从天线下缘到被测介质表面之间，及发射微波波束所辐射的区域内不得有障碍物。</p>
    <img src="/images/products/ht-rd90/ht-rd90-2.jpg" alt="HT-RD90系列高频水利雷达 安装使用">
  en: |-
    <h2>Industry Applications</h2>
    <p>This radar level meter uses a 26 GHz frequency, which provides:</p>
    <ul><li>Narrow beam and concentrated energy for strong anti-interference, accuracy and reliability</li><li>Small antenna, easy to install and fit with dust covers</li><li>Light weight (about 1 kg), easy to install</li><li>Range up to 70 m for large reservoirs</li><li>Multiple output interfaces for data acquisition systems</li><li>Pulsed operation with very low emission, harmless to people and the environment</li></ul>
    <h2>Installation &amp; Use</h2>
    <ul><li>Before installation</li></ul>
    <p>Observe the following to ensure correct installation:</p>
    <p>Leave enough installation space.</p>
    <p>Avoid locations with strong vibration.</p>
    <ul><li>Diagram and mounting position</li></ul>
    <p>Note: the antenna emits microwave pulses at a beam angle. Keep the area between the antenna and the medium surface, and within the beam, free of obstacles.</p>
    <img src="/images/products/ht-rd90/ht-rd90-2.jpg" alt="HT-RD90 Installation &amp; Use">
