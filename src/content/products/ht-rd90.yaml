name:
  zh: "HT-RD90系列高频水利雷达"
  en: "HT-RD90 High-frequency Hydrological Radar"
summary:
  zh: "雷达液位计天线发射及窄的微波脉冲，这个脉冲以光速在空间传播，遇到被测介质表面，其部分能量被反射回来，被同一天线接收。发射脉冲与接收脉冲的时间间隔与天线到被测介质表面的距离成正比。由于电磁波的传播速度极高，发射脉冲与接收脉冲的时间间隔很小（纳秒量级）很难确认，90X系列26G雷达液位计采用一种特殊的解调技术，可以准确识别发射脉冲与接收脉冲的时间间隔，从而进一步计算出天线到被测介质表面的距离。"
  en: "The radar antenna emits very narrow microwave pulses that travel at the speed of light and are partly reflected by the medium surface back to the same antenna. The time between transmitted and received pulses is proportional to the distance to the surface. Because this interval is only nanoseconds, the 90X series 26 GHz radar uses a special demodulation technique to identify it accurately and calculate the distance."
