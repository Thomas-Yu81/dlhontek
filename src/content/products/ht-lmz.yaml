body:
  zh: |-
    <h2>性能特点</h2>
    <p>HT-LMZ超声波明渠流量计与各种国家标准堰或槽配套，主要适用于具有自由流条件的河道，灌渠、工厂、城市污水排水沟及非满管管道内流量的测量。仪器工作时，传感器不与被测流体接触，避免了渠道内污水的沾污和腐蚀。用于测量污水流量，可以比其它形式的仪表，具有更高的可靠性。</p>
    <p>HT-LMZ超声波明渠流量计是根据特定形状的流道，保证一定液位高度得出流量。其传感器安装在测量点的上方，通过单片机处理，测量出液位高度,再根据流量计算法公式Q=Chan (c,no为设定参数)即可得到液体流量。选用巴歇尔槽、距形槽或三角槽作为特定流道，安装方便。</p>
    <h2>仪表选型</h2>
    <table><thead><tr><th>序号</th><th>组件/参数</th><th>选项</th></tr></thead><tbody><tr><td>Ⅰ</td><td>渠堰类型</td><td>R---------矩形 / T---------三角形 / B---------巴歇尔槽</td></tr><tr><td>Ⅱ</td><td>流量范围</td><td>0-3000t/h</td></tr></tbody></table>
  en: |-
    <h2>Features</h2>
    <p>The HT-LMZ works with standard weirs and flumes to measure free-surface flow in rivers, irrigation canals, factory and municipal drains and partially filled pipes. The sensor never contacts the liquid, avoiding fouling and corrosion, which makes it more reliable than other meters for wastewater flow.</p>
    <p>The HT-LMZ derives flow from the liquid level in a channel of defined shape. The sensor is mounted above the measuring point; the microcontroller measures the level and calculates flow with Q = C·h^n (C and n are set parameters). Parshall, rectangular or V-notch flumes can be used and are easy to install.</p>
    <h2>Model Selection</h2>
    <table><thead><tr><th>No.</th><th>Item</th><th>Options</th></tr></thead><tbody><tr><td>Ⅰ</td><td>Flume type</td><td>R - rectangular / T - V-notch / B - Parshall</td></tr><tr><td>Ⅱ</td><td>Flow range</td><td>0-3000t/h</td></tr></tbody></table>
