name:
  zh: "HT-LDE系列电磁流量计"
  en: "HT-LDE Electromagnetic Flowmeter"
summary:
  zh: "HT-LDE系列电磁流量计是根据电磁感应定律，按JB/T9248-1999标准制造, 用于测量管道中导电液体的体积流量，如水、污水、泥浆、矿浆、酸、碱、盐液体及食品浆液等。在石油化工、冶金、煤炭、水利工程给排水、污水处理等行业中广泛应用。"
  en: "The HT-LDE electromagnetic flowmeter, built to JB/T 9248-1999, measures the volumetric flow of conductive liquids in pipes, such as water, wastewater, mud, ore slurry, acids, alkalis, salt solutions and food slurries. It is widely used in petrochemical, metallurgy, coal, water supply and drainage, and wastewater treatment."
features:
  zh:
    - "测量不受液体密度、粘度、温度、压力和导电率变化的影响"
    - "测量管内无活动及阻流部件，无压损、不堵塞，可测量含有纤维、固体颗粒和悬浮物的液体"
    - "采用16位嵌入式微处理器，运算速度快，功耗低"
    - "高清晰度背光LCD显示，全中文菜单，操作简捷"
    - "仪表反映灵敏，量程比可达1:10-1:20 ，量程范围可任意选定流速0.3～10 m/s ，导电率>5μs/cm的导电液体都可测量"
    - "仪表不受液体流动方向的影响，正反向安装均可测量；安装方便，对直管段要求不高"
    - "电磁流量计的电极及内衬材料耐腐蚀性和耐磨性极好，寿命长，可按用户特殊工况要求定制非标电磁流量计"
    - "仪表的耐冲击、耐振性良好"
    - "具有MODBUS、HART、RS485、RS232等数字通讯信号输出"
  en:
    - "Unaffected by changes in density, viscosity, temperature, pressure and conductivity"
    - "No moving or obstructing parts: no pressure loss, no clogging; handles fibers, solids and suspended matter"
    - "16-bit embedded microprocessor, fast and low power"
    - "High-definition backlit LCD, Chinese menu, simple operation"
    - "Responsive, turndown 1:10-1:20, freely set range 0.3-10 m/s, for liquids above 5 μS/cm"
    - "Bidirectional measurement; easy installation with short straight-run requirements"
    - "Highly corrosion- and wear-resistant electrodes and liners, long life; custom designs available"
    - "Good shock and vibration resistance"
    - "MODBUS, HART, RS485 and RS232 communication"
