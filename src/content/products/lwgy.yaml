name:
  zh: "LWGY系列涡轮流量计"
  en: "LWGY Turbine Flowmeter"
summary:
  zh: "LWGY系列涡轮流量计具有结构简单、轻巧、复现性好、反应灵敏，安装维护使用方便等特点的新一代涡轮流量计，广泛用于测量封闭管道中与不锈钢1Cr18Ni9Ti、2Cr13及刚玉Al2O3、硬质合金不起腐蚀作用，且无纤维、颗粒等杂质，工作温度下运动粘度小于5×10-6m2/s的液体，对于运动粘度大于5×10-6m2/s的液体，可对流量计进行实液标定后使用。"
  en: "The LWGY is a new-generation turbine flowmeter: simple, light, repeatable, responsive and easy to install and maintain. It measures liquids in closed pipes that do not corrode 1Cr18Ni9Ti, 2Cr13 stainless steel, corundum (Al2O3) or carbide, contain no fibers or particles, and have a kinematic viscosity below 5×10-6 m2/s at operating temperature. Higher-viscosity liquids can be measured after calibration with the actual liquid."
features:
  zh:
    - "准确度，一般可达±1%、±0.5%"
    - "重复性好，短期重复性可达0.05%~0.2%,正是由于具有良好的重复性，如经常校准或在线校准可得到较高的准确度"
    - "输出脉冲频率信号，标准4～20mA模拟信号，RS485数字信号适于总量计量及与计算机连接，无零点漂移，抗干扰能力强，信号强度高"
    - "范围度宽，中大口径可达1:20，小口径为1:10"
    - "结构紧凑轻巧，安装维护方便，流通能力大"
    - "适用高压测量，仪表表体上不必开孔，易制成高压型仪表"
    - "可制成插入型，适用于大口径测量，压力损失小，价格低，可不断流取出，安装维护方便"
  en:
    - "Accuracy typically ±1% or ±0.5%"
    - "Short-term repeatability 0.05%-0.2%; frequent or online calibration gives higher accuracy"
    - "Pulse frequency, 4-20mA and RS485 outputs for totalizing and computer connection; no zero drift, strong anti-interference"
    - "Wide turndown: 1:20 for medium/large sizes, 1:10 for small sizes"
    - "Compact and light, easy maintenance, high flow capacity"
    - "Suitable for high pressure; no holes in the body"
    - "Insertion version for large pipes: low pressure loss, low cost, removable without stopping flow"
