body:
  zh: |-
    <h2>仪表分类</h2>
    <p>按仪表功能分类，LWGY系列涡轮流量计分为两大类：</p>
    <ul><li>涡轮流量传感器/变送器</li></ul>
    <p>LWGY-N型传感器：12～24VDC供电，三线制脉冲输出；</p>
    <p>LWGY-A型变送器：24VDC供电，二线制4～20mA输出。</p>
    <ul><li>智能一体化涡轮流量计</li></ul>
    <p>LWGY-B型：供电电源采用3.2V10AH锂电池（可连续运行4年以上）；无信号输出功能。</p>
    <p>LWGY-C型：供电电源采用24VDC外供电，输出4～20mA标准两线制电流信号，并可根据不同的现场需要，增加RS485或HART通讯。</p>
    <h2>仪表选型</h2>
    <table><thead><tr><th>序号</th><th>组件/参数</th><th>选项</th></tr></thead><tbody><tr><td>Ⅰ</td><td>测量管径</td><td>DN10～DN300</td></tr><tr><td>Ⅱ</td><td>仪表类型</td><td>N-----涡轮传感器（脉冲输出） / A-----涡轮变送器（4-20mA输出） / B-----现场显示型（无信号输出） / C-----现场智能型（有信号输出）</td></tr><tr><td>Ⅲ</td><td>工作压力</td><td>P1-----1.6MPa / P2-----2.5MPa / P3-----4.0MPa / P4-----6.3MPa / P5-----16MPa / P6-----25MPa</td></tr><tr><td>Ⅵ</td><td>工作电源</td><td>D1-----直流12VDC / D2-----直流24VDC / D3-----电池供电</td></tr><tr><td>Ⅶ</td><td>信号输出</td><td>H1-----4-20mA / H2-----脉冲输出 / H3-----RS485 / H4-----HART</td></tr></tbody></table>
  en: |-
    <h2>Versions</h2>
    <p>By function, LWGY turbine flowmeters fall into two groups:</p>
    <ul><li>Turbine flow sensor / transmitter</li></ul>
    <p>LWGY-N sensor: 12-24VDC, 3-wire pulse output</p>
    <p>LWGY-A transmitter: 24VDC, 2-wire 4-20mA output</p>
    <ul><li>Intelligent integral turbine flowmeter</li></ul>
    <p>LWGY-B: 3.2V 10Ah lithium battery (runs over 4 years); no signal output</p>
    <p>LWGY-C: external 24VDC, 2-wire 4-20mA output; RS485 or HART optional</p>
    <h2>Model Selection</h2>
    <table><thead><tr><th>No.</th><th>Item</th><th>Options</th></tr></thead><tbody><tr><td>Ⅰ</td><td>Pipe size</td><td>DN10～DN300</td></tr><tr><td>Ⅱ</td><td>Type</td><td>N - sensor (pulse) / A - transmitter (4-20mA) / B - local display (no output) / C - local intelligent (with output)</td></tr><tr><td>Ⅲ</td><td>Working pressure</td><td>P1-----1.6MPa / P2-----2.5MPa / P3-----4.0MPa / P4-----6.3MPa / P5-----16MPa / P6-----25MPa</td></tr><tr><td>Ⅵ</td><td>Power supply</td><td>D1 - 12VDC / D2 - 24VDC / D3 - battery</td></tr><tr><td>Ⅶ</td><td>Signal output</td><td>H1 - 4-20mA / H2 - pulse / H3 - RS485 / H4 - HART</td></tr></tbody></table>
