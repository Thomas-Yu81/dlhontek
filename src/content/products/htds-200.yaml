model: "HTDS-200"
category: level
featured: false
order: 220
name:
  zh: "HTDS-200系列分体超声波液位计/液位差计"
  en: "HTDS-200 Remote Ultrasonic Level / Level Difference Meter"
summary:
  zh: "HTDS-200系列分体超声波液位仪计/液位差计是一种智能非接触式液位测量仪表。产品具有发射功率可调整，全量程内增益控制，自动温度补偿等功能，能识别虚假信号，从而有效去除各种干扰信号。本系列产品可广泛用于各种液体的液位和固体物位测量，同时也可用于测距使用。"
  en: "The HTDS-200 remote ultrasonic level / level difference meter is an intelligent non-contact instrument for liquids and solids. It features adjustable transmit power, full-range gain control and automatic temperature compensation, and identifies false echoes to reject interference. It can also be used for distance measurement."
features:
  zh:
    - "采用SMD技术，提高仪器的可靠性"
    - "自动功率调整、增益控制、温度补偿"
    - "丰富的软件功能适应各种复杂环境"
    - "具有干扰回波的抑止功能保证测量数据的真实性"
    - "16位D/A转换，提高电流输出的准确度和分辨率"
    - "传感器可采用聚四氟乙烯材料，用于各种腐蚀性场合仪表选型"
  en:
    - "SMD construction for high reliability"
    - "Automatic power adjustment, gain control and temperature compensation"
    - "Rich software functions for complex conditions"
    - "False-echo suppression for reliable data"
    - "16-bit D/A for accurate, high-resolution current output"
    - "PTFE sensor option for corrosive applications"
applications:
  zh: []
  en: []
specs:
  - label: { zh: "工作电源", en: "Power supply" }
    value: { zh: "AC-220V、DC-24V", en: "220VAC, 24VDC" }
  - label: { zh: "信号输出", en: "Signal output" }
    value: { zh: "4-20mA(16位D/A,750欧姆负载)、RS485", en: "4-20mA (16-bit D/A, 750Ω load), RS485" }
  - label: { zh: "工作量程", en: "Range" }
    value: { zh: "HTDS-200K超声波液位计：0-40m任何段；HTDS-200C超声波液位差计：0-30m任何段", en: "HTDS-200K level meter: Any span within 0-40 m; HTDS-200C level difference meter: Any span within 0-30 m" }
  - label: { zh: "控制输出", en: "Control output" }
    value: { zh: "HTDS-200K超声波液位计：四路继电器,可编程；HTDS-200C超声波液位差计：四路继电器,可编程（液位差）", en: "HTDS-200K level meter: 4 programmable relays; HTDS-200C level difference meter: 4 programmable relays (level difference)" }
  - label: { zh: "工作盲区", en: "Blind zone" }
    value: { zh: "HTDS-200K超声波液位计：0.2m—1.0m；HTDS-200C超声波液位差计：0.2m—0.6m", en: "HTDS-200K level meter: 0.2m—1.0m; HTDS-200C level difference meter: 0.2m—0.6m" }
  - label: { zh: "工作压力", en: "Working pressure" }
    value: { zh: "常压", en: "Atmospheric" }
  - label: { zh: "分辨率", en: "Resolution" }
    value: { zh: "量程≤15m：1mm 量程＞15m：1cm", en: "≤ 15 m: 1 mm; > 15 m: 1 cm" }
  - label: { zh: "精确度", en: "Accuracy" }
    value: { zh: "HTDS-200K超声波液位计：0.25%、0.5%；HTDS-200C超声波液位差计：0.3%", en: "HTDS-200K level meter: 0.25%, 0.5%; HTDS-200C level difference meter: 0.3%" }
  - label: { zh: "环境温度", en: "Ambient temperature" }
    value: { zh: "变送器：-25℃-70℃ / 传感器：-25℃-80℃", en: "Transmitter: -25 to 70℃ / Sensor: -25 to 80℃" }
  - label: { zh: "防护等级", en: "Protection" }
    value: { zh: "变送器：IP65, 传感器：IP67", en: "Transmitter: IP65; sensor: IP67" }
  - label: { zh: "显示方式", en: "Display" }
    value: { zh: "16位×2 LCD背光", en: "16×2 backlit LCD" }
tags: ["4-20mA", "RS485", "IP65", "IP67"]
