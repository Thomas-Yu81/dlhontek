model: "HT-USD"
category: concentration
featured: false
order: 20
name:
  zh: "HT-USD系列超声波浓度计"
  en: "HT-USD Ultrasonic Concentration Meter"
summary:
  zh: "HT-USD型超声波污泥浓度计利用水中固浮物对超声波的衰减，测量悬浮物浓度；超声波在污泥和悬浮物中的衰减与液体中的污泥和悬浮物的浓度有关，根据这一原理超声波污泥浓度计实现了污泥和悬浮物浓度的在线测量和监控。"
  en: "The HT-USD ultrasonic sludge concentration meter measures suspended solids from the attenuation of ultrasound in water. Because attenuation depends on the concentration of sludge and suspended solids, the meter provides online measurement and monitoring of sludge and suspended solids concentration."
features:
  zh:
    - "适合不同种类液体中的污泥和悬浮物的测量"
    - "现场标定简便"
    - "可输出污泥浓度%或g/l，现场选择"
    - "管段式为全不锈钢材质，耐腐蚀、抗沾附性更强"
    - "管段式带喷嘴和采样阀，用于自清洗和采样标定"
    - "浸没式传感器为不锈钢焊接结构"
    - "防护等级：IP68"
    - "超宽液晶，棒图显示"
    - "可选2点或3点标定，测量精度高"
  en:
    - "Measures sludge and suspended solids in many kinds of liquids"
    - "Easy on-site calibration"
    - "Output in % or g/L, selectable on site"
    - "All-stainless spool version with better corrosion and fouling resistance"
    - "Spool version with nozzle and sampling valve for self-cleaning and sample calibration"
    - "Welded stainless steel submersion sensor"
    - "Protection: IP68"
    - "Wide LCD with bar graph"
    - "2- or 3-point calibration for high accuracy"
applications:
  zh: []
  en: []
