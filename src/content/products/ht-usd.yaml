body:
  zh: |-
    <h2>应用场合</h2>
    <p>给水厂及污水处理厂：</p>
    <p>回流污泥、初沉池、二沉池、浓缩池、污泥脱水等。</p>
    <p>工矿企业：</p>
    <p>洗煤厂、矿山、造纸、电力矿浆浓度、煤浆浓度、灰浆浓度、纸浆浓度等。</p>
  en: |-
    <h2>Applications</h2>
    <p>Water and wastewater treatment plants:</p>
    <p>Return sludge, primary and secondary clarifiers, thickeners, sludge dewatering, etc.</p>
    <p>Industrial and mining:</p>
    <p>Coal washing plants, mines, paper and power plants: ore slurry, coal slurry, mortar and pulp concentration, etc.</p>
