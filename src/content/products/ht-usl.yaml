body:
  zh: |-
    <h2>安装使用</h2>
    <ul><li>泥水界面仪传感器探头必须和水面保持垂直安装。</li><li>泥水界面仪传感器探头与池底之间应该无其他固体遮挡，否则会产生干扰信号。泥水界面仪传感器探头应该避免受到水中漂浮物的撞击，如果水中悬浮物容易黏附在探头表面，建议安装自清洗系统以保持探头表面清洁。</li><li>探头浸没深度推荐为20cm左右，探头距池壁距离不低于30cm。</li></ul>
    <img src="/images/products/ht-usl/ht-usl-3.png" alt="HT-USL系列超声波泥水界面仪 安装使用">
  en: |-
    <h2>Installation &amp; Use</h2>
    <ul><li>The sensor probe must be mounted perpendicular to the water surface.</li><li>There must be no solid obstruction between the probe and the tank bottom, otherwise false echoes occur. Protect the probe from floating debris; if solids tend to stick to it, install a self-cleaning system.</li><li>Recommended immersion depth is about 20 cm, at least 30 cm from the tank wall.</li></ul>
    <img src="/images/products/ht-usl/ht-usl-3.png" alt="HT-USL Installation &amp; Use">
