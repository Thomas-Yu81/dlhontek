model: "HT-USL"
category: water-quality
featured: true
order: 80
name:
  zh: "HT-USL系列超声波泥水界面仪"
  en: "HT-USL Ultrasonic Sludge Blanket Level Meter"
summary:
  zh: "HT-USL超声波泥水界面仪为污水处理工艺中污泥界面的连续在线监测而设计。仪器利用可靠的超声波回波检测原理，检测出传感器探头与污泥界面的距离和底面的距离，实现了0-10米污泥厚度变化实时监测和相关工艺过程的控制，从而优化排泥控制和加药控制，防止出水恶化，避免污泥脱氮和分解，优化工艺控制流程。"
  en: "The HT-USL is designed for continuous online monitoring of the sludge blanket in wastewater treatment. Using ultrasonic echo detection, it measures the distance from the probe to the sludge interface and to the tank bottom, monitoring sludge depth from 0 to 10 m in real time. This optimizes sludge withdrawal and chemical dosing, prevents effluent deterioration and avoids sludge denitrification and decomposition."
features:
  zh:
    - "超声波发射能量自动调节，能够适应各种测量介质和宽广的量程"
    - "先进的电路设计和软件算法，能够消除现场干扰，稳定精确测量"
    - "大屏幕液晶显示测量值的同时可以图形显示污泥分层状态"
    - "中文菜单，操作简便"
    - "4-20mA隔离电流输出"
    - "可选现场总线接口"
    - "设定限值报警和故障报警继电器输出"
  en:
    - "Automatic adjustment of ultrasonic transmit power for various media and wide ranges"
    - "Advanced circuitry and algorithms reject field interference for stable, accurate measurement"
    - "Large LCD shows readings and a graphical sludge profile"
    - "Chinese menu, easy operation"
    - "Isolated 4-20mA current output"
    - "Optional fieldbus interface"
    - "Relay outputs for limit and fault alarms"
