body:
  zh: |-
    <h2>安装使用</h2>
    <ul><li>首次使用或更换电极时需要对仪器进行校正，以后每6个月进行一次校正，具体情况根据现场使用情况而定。</li><li>仪器与电极之间必须使用专用屏蔽线且不能剪断，信号线长度不能超过30米，若要延长或剪断信号线必须安装前置信号放大器。</li><li>仪器与电极安装地点应尽量避开变频器、380V电极等干扰源，若有干扰应做好屏蔽工作。</li><li>继电器与380V设备连接时需要使用交流接触器。</li></ul>
  en: |-
    <h2>Installation &amp; Use</h2>
    <ul><li>Calibrate the instrument on first use and after replacing the electrode, then every 6 months depending on site conditions.</li><li>Use the dedicated shielded cable between instrument and electrode and do not cut it. The signal cable must not exceed 30 m; a preamplifier is required to extend or cut it.</li><li>Install away from interference sources such as VFDs and 380V equipment; shield properly if interference exists.</li><li>Use an AC contactor when connecting relays to 380V equipment.</li></ul>
