body:
  zh: |-
    <h2>可选主机</h2>
    <table><thead><tr><th>名称</th><th>备注</th></tr></thead><tbody><tr><td>壁挂式主机</td><td>适用于各种现场的标准配置主机</td></tr><tr><td>防爆式主机</td><td>适用于有防爆要求的介质或者现场</td></tr><tr><td>盘装式主机</td><td>适用于有主控柜或者有布局要求的现场</td></tr></tbody></table>
    <h2>备品备件</h2>
    <table><thead><tr><th>名称</th><th>备注</th></tr></thead><tbody><tr><td>标准小型传感器S型</td><td>测量范围：DN15-100mm</td></tr><tr><td>标准中型传感器M型</td><td>测量范围：DN50-700mm</td></tr><tr><td>标准大型传感器L型</td><td>测量范围：DN300-6000mm</td></tr><tr><td>标准插入式传感器</td><td>适用于DN80以上管径，适用温度≤160℃ / 插入式安装，可实现在线不停水安装</td></tr><tr><td>标准管段式传感器</td><td>可根据现场实际情况定制</td></tr></tbody></table>
  en: |-
    <h2>Transmitter Options</h2>
    <table><thead><tr><th>Name</th><th>Remarks</th></tr></thead><tbody><tr><td>Wall-mount transmitter</td><td>Standard transmitter for most sites</td></tr><tr><td>Explosion-proof transmitter</td><td>For hazardous media or areas</td></tr><tr><td>Panel-mount transmitter</td><td>For control cabinets or layout constraints</td></tr></tbody></table>
    <h2>Sensors &amp; Accessories</h2>
    <table><thead><tr><th>Name</th><th>Remarks</th></tr></thead><tbody><tr><td>Standard small sensor S</td><td>Range: DN15-100</td></tr><tr><td>Standard medium sensor M</td><td>Range: DN50-700</td></tr><tr><td>Standard large sensor L</td><td>Range: DN300-6000</td></tr><tr><td>Standard insertion sensor</td><td>For DN80 and above, ≤ 160℃ / hot-tap installation without stopping flow</td></tr><tr><td>Standard spool sensor</td><td>Custom-made to site requirements</td></tr></tbody></table>
